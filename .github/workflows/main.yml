name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ruby/setup-ruby@v1.338.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: bytecodealliance/setup-wasi-sdk-action@v1.0.0
        with:
          version: '34'
          add-to-path: false
      - run: npm ci --ignore-scripts
      - run: bundle exec rake build spec

  build:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ruby/setup-ruby@v1.338.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - uses: bytecodealliance/setup-wasi-sdk-action@v1.0.0
        with:
          version: '34'
          add-to-path: false
      - uses: release-gems/action/build@v1.2.2
        with:
          sandbox: bubblewrap

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-slim
    timeout-minutes: 10
    environment: rubygems.org
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: release-gems/action/publish@v1.2.2
